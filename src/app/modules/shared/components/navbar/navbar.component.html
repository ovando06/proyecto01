<mat-toolbar>
  <button id="menuSecciones" mat-icon-button class="example-icon" [matMenuTriggerFor]="seccion" >
    <mat-icon>menu</mat-icon>
  </button>

  <mat-menu #seccion="matMenu">

    <button mat-button routerLink="/inicio">Inicio</button>

    <button mat-button [matMenuTriggerFor]="producto">Productos</button>
  </mat-menu>
  

  <span>My App</span>

  <!--se van a mostrar cuando la pantalla sea mayor a 700px-->
  <!--Botón para la vista de inicio-->
  <button id="menuInicio" mat-menu-item routerLink="/inicio">Inicio</button>


  <!--MENU DESPLEGABLE -> PRODUCTOS -->
  <button id="menuProducto" mat-menu-item [matMenuTriggerFor]="producto">Productos</button>
  <mat-menu #producto="matMenu">
    <button mat-menu-item routerLink="/general">General</button>
    <button mat-menu-item routerLink="/papeleria">Papeleria</button>
    <button mat-menu-item routerLink="/indumentaria">Indumentaria</button>
    <button mat-menu-item routerLink="/accesorios">Accesorios</button>

  </mat-menu>
  <span class="example-spacer"></span>

  <!-- Menu desplegable para manejar todo el acceso de los usuarios en la pagina-->
  <button mat-button [matMenuTriggerFor]="usuario"><mat-icon>person</mat-icon></button>
  <mat-menu #usuario="matMenu">
    <button mat-menu-item (click)="ingresar()" *ngIf="logueado" routerLink="/registro">Registrarse</button>
    <button mat-menu-item (click)="ingresar()" *ngIf="logueado"  routerLink="/inicio-sesion">Iniciar Sesión</button>
    <button mat-menu-item (click)="cerrarSesion()" *ngIf="deslogueado">Cerrar Sesion</button>
  </mat-menu>

  <!--carrito-->
  <button mat-icon-button class="example-icon favorite-icon" aria-label="Example icon-button with heart icon">
    <mat-icon>shopping_cart</mat-icon>
  </button>

  <!--Label para modo oscuro-->
  <label for="toggle" id="label_toggle"><i class="fa-solid fa-moon"></i></label>
  <input type="checkbox" id="toggle" (click)="cambiarfondo()">

</mat-toolbar>
